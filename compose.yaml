name: maru

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maru
      POSTGRES_USER: maru
      POSTGRES_PASSWORD: maru
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maru -d maru"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - maru-postgres:/var/lib/postgresql/data

volumes:
  maru-postgres:
