{% extends "base.html" %}

{% block title %}{{ heading }} - maru{% endblock %}

{% block content %}
  <section class="stack">
    <div>
      <p><a href="{% url 'projects:hotel_list' %}">Back to hotels</a></p>
      <h1>{{ heading }}</h1>
    </div>

    <form class="panel stack" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {{ field.errors }}
        </label>
      {% endfor %}
      <div class="actions">
        <button type="submit">Save hotel</button>
        <a href="{% url 'projects:hotel_list' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
