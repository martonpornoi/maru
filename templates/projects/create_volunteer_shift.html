{% extends "base.html" %}

{% block title %}Create Volunteer Shift - maru{% endblock %}

{% block content %}
  <section class="stack">
    <div>
      <p><a href="{% url 'projects:timetable' project.slug %}">Back to timetable</a></p>
      <h1>Create Volunteer Shift</h1>
      <p class="muted">{{ project.name }}</p>
    </div>

    <form class="panel stack" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {{ field.errors }}
        </label>
      {% endfor %}
      <div class="actions">
        <button type="submit">Create shift</button>
        <a href="{% url 'projects:timetable' project.slug %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
