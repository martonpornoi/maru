{% extends "base.html" %}

{% block title %}{{ heading }} - maru{% endblock %}

{% block content %}
  <section class="stack">
    <div>
      <p><a href="{% url 'projects:hotel_detail' hotel.pk %}">Back to {{ hotel.name }}</a></p>
      <h1>{{ heading }}</h1>
    </div>

    <form class="panel stack" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {% if field.help_text %}<span class="muted">{{ field.help_text }}</span>{% endif %}
          {{ field.errors }}
        </label>
      {% endfor %}
      <div class="actions">
        <button type="submit">Save room</button>
        <a href="{% url 'projects:hotel_detail' hotel.pk %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
