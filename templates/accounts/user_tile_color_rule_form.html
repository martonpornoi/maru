{% extends "base.html" %}

{% block title %}{{ heading }} - maru{% endblock %}

{% block content %}
  <section class="stack">
    <div>
      <p>
        {% if project %}
          <a href="{% url 'accounts:project_user_tile_color_rules' project.slug %}">Back to color codes</a>
        {% else %}
          <a href="{% url 'accounts:user_tile_color_rules' %}">Back to color codes</a>
        {% endif %}
      </p>
      <h1>{{ heading }}</h1>
    </div>

    <form class="panel stack" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {% if field.help_text %}<span class="muted">{{ field.help_text }}</span>{% endif %}
          {{ field.errors }}
        </label>
      {% endfor %}
      <button type="submit">Save color rule</button>
    </form>
  </section>
  <script>
    document.querySelectorAll('input[type="color"]').forEach((input) => {
      input.addEventListener("change", () => input.blur());
    });
  </script>
{% endblock %}
