{% extends "base.html" %}

{% block title %}{{ heading }} - maru{% endblock %}

{% block content %}
  <section class="panel stack">
    <div>
      <h1>{{ heading }}</h1>
      <p><a href="{% url 'accounts:access_grant_list' %}">Back to accounts</a></p>
    </div>
    <form class="stack" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label>
          {{ field.label }}
          {{ field }}
          {{ field.errors }}
        </label>
      {% endfor %}
      <button type="submit">Save account</button>
    </form>
  </section>
{% endblock %}
