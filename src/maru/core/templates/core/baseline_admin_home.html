{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#071B3A">
    <title>Administration · Maru</title>
    <link rel="icon" href="{% static 'core/brand/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'core/baseline.css' %}">
  </head>
  <body>
    <header class="baseline-header">
      <img
        class="baseline-logo"
        src="{% static 'core/brand/maru_rectangle_full_logo.png' %}"
        alt="Maru"
      >
      <div class="baseline-account">
        <span>{{ request.user.display_name }}</span>
        <form method="post" action="{% url 'staff-logout' %}">
          {% csrf_token %}
          <button class="baseline-link-button" type="submit">Sign out</button>
        </form>
      </div>
    </header>

    <main class="baseline-card baseline-card--home" data-page="empty-admin-home">
      <p class="baseline-kicker">Administration</p>
      <h1>Nothing here yet</h1>
      <p class="baseline-intro">
        This workspace is intentionally empty. We will add and review one page
        at a time.
      </p>
    </main>
  </body>
</html>
