{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071B3A">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Staff Console · Maru</title>
    <link rel="icon" href="{% static 'core/brand/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'core/brand/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'core/brand/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'core/brand.css' %}">
    <link rel="stylesheet" href="{% static 'staff-console/app.css' %}">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>The Maru Staff Console requires JavaScript.</p>
    </noscript>
    <form id="maru-logout-form" method="post" action="{% url 'staff-logout' %}" hidden>
      {% csrf_token %}
    </form>
    <form
      id="maru-admin-context-form"
      method="post"
      action="{% url 'admin-edition-context' %}"
      hidden
    >
      {% csrf_token %}
      <input type="hidden" name="next" value="/admin/">
    </form>
    <script type="module" src="{% static 'staff-console/app.js' %}"></script>
  </body>
</html>
