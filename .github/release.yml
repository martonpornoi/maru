changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Security
      labels: ["security"]
    - title: Breaking changes
      labels: ["breaking-change"]
    - title: Features
      labels: ["feature", "enhancement"]
    - title: Fixes
      labels: ["bug", "fix"]
    - title: Documentation and contributor experience
      labels: ["documentation", "dependencies", "ci"]
    - title: Other changes
      labels: ["*"]
