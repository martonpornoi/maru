version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontends/staff-console
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Budapest
    open-pull-requests-limit: 0
    groups:
      staff-console-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
