version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      python-development:
        dependency-type: development
      python-runtime:
        dependency-type: production

  - package-ecosystem: npm
    directory: /frontends/staff-console
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      staff-console:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
