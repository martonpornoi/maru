name: Reusable full acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Locked inputs and Actions policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify locked and immutable automation inputs
        run: |
          python -m pip install uv==0.11.29 PyYAML==6.0.3
          uv lock --check
          python scripts/validate_actions_allowlist.py

  static:
    name: Full Python static analysis
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --all-groups --locked
      - name: Distribution license contracts
        run: |
          uv run pytest tests/unit/test_package_licensing.py \
            tests/unit/test_release_metadata.py -q
      - name: Build and inspect Python distributions
        run: |
          uv build --out-dir .ci-distributions
          uv run python scripts/verify_package_artifacts.py \
            --distribution-directory .ci-distributions
      - name: Static analysis
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run python scripts/validate_docs.py

  documentation:
    name: Full contributor documentation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --all-groups --locked
      - name: Build warning-fatal contributor documentation
        run: |
          uv run pydoclint src scripts
          uv run python scripts/validate_python_docstrings.py src scripts
          uv run sphinx-build -W --keep-going --fresh-env -j auto -d docs/_build/doctrees -b html docs docs/_build/html
      - name: Upload contributor documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contributor-documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

  contracts:
    name: Full Django, contracts, and frontend
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontends/staff-console/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --all-groups --locked
          pnpm --dir frontends/staff-console install --frozen-lockfile
      - name: Django and generated contracts
        run: |
          uv run python src/manage.py check --settings=maru.settings.local
          uv run python src/manage.py makemigrations --check --dry-run --settings=maru.settings.local
          uv run python scripts/verify_production_settings.py
          uv run python src/manage.py spectacular --file openapi.yaml --validate --settings=maru.settings.local
          pnpm --dir frontends/staff-console run generate:api
          git diff --exit-code -- openapi.yaml
          git diff --exit-code -- frontends/staff-console/src/api/schema.d.ts
      - name: Staff Console acceptance
        working-directory: frontends/staff-console
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
          git diff --exit-code -- ../../src/maru/core/static/staff-console
          if ! UNTRACKED_GENERATED_FILES=$(git ls-files --others --exclude-standard -- ../../src/maru/core/static/staff-console); then
            echo "Unable to inspect generated Staff Console output."
            exit 1
          fi
          if test -n "$UNTRACKED_GENERATED_FILES"; then
            printf '%s\n' "$UNTRACKED_GENERATED_FILES"
            exit 1
          fi

  security:
    name: Full dependency security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontends/staff-console/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --all-groups --locked
          pnpm --dir frontends/staff-console install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: |
          uv run pip-audit
          pnpm --dir frontends/staff-console audit --audit-level high

  unit:
    name: Full unit coverage
    needs: [static, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARU_DATABASE_URL: postgresql://maru:maru@127.0.0.1:1/maru_unit_no_database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: python -m pip install uv==0.11.29
      - run: uv sync --all-groups --locked
      - name: Run unit tests with partial coverage
        run: |
          mkdir -p coverage-parts reports
          COVERAGE_FILE=coverage-parts/.coverage.unit uv run pytest tests/unit -q \
            --cov=maru --cov-report= --cov-fail-under=0 \
            --junitxml=reports/unit.xml --durations=25
      - name: Upload unit diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-unit-results
          path: |
            coverage-parts
            reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Full PostgreSQL integration (${{ matrix.shard }}/8)
    needs: [static, security]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: maru
          POSTGRES_USER: maru
          POSTGRES_PASSWORD: maru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maru -d maru"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MARU_DATABASE_URL: postgresql://maru:maru@127.0.0.1:5432/maru
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: python -m pip install uv==0.11.29
      - run: uv sync --all-groups --locked
      - name: Run measured file-level shard
        run: |
          mkdir -p coverage-parts reports
          COVERAGE_FILE=coverage-parts/.coverage.integration-${{ matrix.shard }} \
            uv run python scripts/run_ci_test_shard.py \
            --shard-index ${{ matrix.shard }} --shard-count 8 -- \
            -q --cov=maru --cov-report= --cov-fail-under=0 \
            --junitxml=reports/integration-${{ matrix.shard }}.xml \
            --durations=25
      - name: Upload integration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-integration-${{ matrix.shard }}-results
          path: |
            coverage-parts
            reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Full combined coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: python -m pip install uv==0.11.29
      - run: uv sync --all-groups --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: full-*-results
          path: .ci-artifacts
          merge-multiple: true
      - name: Enforce repository coverage
        run: |
          uv run coverage combine .ci-artifacts/coverage-parts
          uv run coverage report --fail-under=90
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: full-combined-coverage
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: warn
          retention-days: 7

  full-ci-gate:
    name: Full CI gate
    needs:
      [preflight, static, documentation, contracts, security, unit, integration, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every full acceptance job
        if: >-
          ${{
            needs.preflight.result != 'success' ||
            needs.static.result != 'success' ||
            needs.documentation.result != 'success' ||
            needs.contracts.result != 'success' ||
            needs.security.result != 'success' ||
            needs.unit.result != 'success' ||
            needs.integration.result != 'success' ||
            needs.coverage.result != 'success'
          }}
        run: exit 1
      - run: echo "Full Maru acceptance passed."
