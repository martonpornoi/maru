name: Release

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release pull request number
        required: true
        type: number
      channel:
        description: Candidate for rehearsal, gold for a supported release
        required: true
        default: candidate
        type: choice
        options: [candidate, gold]
      candidate_number:
        description: Positive sequence for a candidate; leave empty for gold
        required: false
        type: number
      release_immutability_verified:
        description: Confirm the admin API reported release immutability enabled immediately before dispatch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_pr }}-${{ inputs.channel }}-${{ inputs.candidate_number || 'gold' }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject invalid release inputs before certification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_NUMBER: ${{ inputs.candidate_number }}
          RELEASE_IMMUTABILITY_VERIFIED: ${{ inputs.release_immutability_verified }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main."
            exit 1
          fi
          if [[ "$RELEASE_IMMUTABILITY_VERIFIED" != "true" ]]; then
            echo "Confirm the current immutable-release admin API readback before dispatch."
            exit 1
          fi
          if ! [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "The release pull request number must be positive."
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            if ! [[ "$CANDIDATE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Candidate releases require a positive candidate number."
              exit 1
            fi
          elif [[ -n "$CANDIDATE_NUMBER" && "$CANDIDATE_NUMBER" != "0" ]]; then
            echo "Gold releases cannot have a candidate number."
            exit 1
          fi
          MERGE_SHA=$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          BASE_BRANCH=$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          STATE=$(gh pr view "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [[ "$STATE" != "MERGED" || "$BASE_BRANCH" != "main" || "$MERGE_SHA" != "$GITHUB_SHA" ]]; then
            echo "The release PR must be merged into main at the exact workflow commit."
            exit 1
          fi

  certify:
    name: Certify exact source
    needs: validate-request
    uses: ./.github/workflows/_full-ci.yml

  publish:
    name: Publish immutable release
    needs: [validate-request, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.channel == 'gold' && 'gold' || 'candidate' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release PR and derive CalVer
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_NUMBER: ${{ inputs.candidate_number }}
          RELEASE_IMMUTABILITY_VERIFIED: ${{ inputs.release_immutability_verified }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main."
            exit 1
          fi
          if [[ "$RELEASE_IMMUTABILITY_VERIFIED" != "true" ]]; then
            echo "Confirm the current immutable-release admin API readback before dispatch."
            exit 1
          fi
          CURRENT_MAIN=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo "The release commit is no longer the exact current main commit."
            exit 1
          fi
          MERGED_AT=$(gh pr view "$RELEASE_PR" --json mergedAt --jq .mergedAt)
          MERGE_SHA=$(gh pr view "$RELEASE_PR" --json mergeCommit --jq .mergeCommit.oid)
          BASE_BRANCH=$(gh pr view "$RELEASE_PR" --json baseRefName --jq .baseRefName)
          STATE=$(gh pr view "$RELEASE_PR" --json state --jq .state)
          if [[ "$STATE" != "MERGED" || "$BASE_BRANCH" != "main" || "$MERGE_SHA" != "$GITHUB_SHA" ]]; then
            echo "The release PR must be merged into main at the exact workflow commit."
            exit 1
          fi
          CANDIDATE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            CANDIDATE_ARGS=(--candidate-number "$CANDIDATE_NUMBER")
          fi
          python scripts/release_metadata.py \
            --pull-request "$RELEASE_PR" \
            --merged-at "$MERGED_AT" \
            --commit "$GITHUB_SHA" \
            --channel "$RELEASE_CHANNEL" \
            "${CANDIDATE_ARGS[@]}" \
            --output-directory release-assets
          cat release-assets/github-output >> "$GITHUB_OUTPUT"
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          GENERATED_VERSION=$(sed -n 's/^python_version=//p' release-assets/github-output)
          if [[ "$EXPECTED_VERSION" != "$GENERATED_VERSION" ]]; then
            echo "pyproject.toml version $EXPECTED_VERSION must equal $GENERATED_VERSION."
            exit 1
          fi
          TAG=$(sed -n 's/^tag=//p' release-assets/github-output)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Git tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image name
        id: image
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Container image $IMAGE already exists."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish the application image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            MARU_BUILD_VERSION=${{ steps.metadata.outputs.version }}
            MARU_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Download certified contributor documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contributor-documentation
          path: release-assets/docs

      - name: Assemble release evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python -c "import json, pathlib; p=pathlib.Path('release-assets/release-manifest.json'); d=json.loads(p.read_text()); d.update({'image': '$IMAGE', 'image_digest': '$IMAGE_DIGEST'}); p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')"
          rm -rf release-assets/docs/.doctrees
          cp LICENSE THIRD_PARTY_NOTICES.md release-assets/docs/
          tar -czf "release-assets/maru-docs-$RELEASE_VERSION.tar.gz" -C release-assets/docs .
          rm -rf release-assets/docs release-assets/github-output
          cp openapi.yaml uv.lock LICENSE THIRD_PARTY_NOTICES.md release-assets/
          cp frontends/staff-console/pnpm-lock.yaml release-assets/pnpm-lock.yaml
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
          printf '%s\n\nOCI image: `%s@%s`\n\nThis release was certified from pull request #%s and exact commit `%s`.\n' \
            "$RELEASE_TITLE" "$IMAGE" "$IMAGE_DIGEST" "${{ inputs.release_pr }}" "$GITHUB_SHA" \
            > release-assets/release-notes.md

      - name: Create the complete draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          RELEASE_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/release-manifest.json \
            "release-assets/maru-docs-$RELEASE_VERSION.tar.gz" \
            release-assets/openapi.yaml \
            release-assets/uv.lock \
            release-assets/pnpm-lock.yaml \
            release-assets/LICENSE \
            release-assets/THIRD_PARTY_NOTICES.md \
            release-assets/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-assets/release-notes.md \
            --generate-notes \
            --draft \
            "${RELEASE_ARGS[@]}"

      - name: Verify draft evidence before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mapfile -t DRAFT_IDS < <(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id"
          )
          if [[ "${#DRAFT_IDS[@]}" -ne 1 ]]; then
            echo "Expected exactly one draft release for $RELEASE_TAG."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/${DRAFT_IDS[0]}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            > release-assets/release-draft.json
          ASSETS=(
            release-assets/release-manifest.json
            "release-assets/maru-docs-$RELEASE_VERSION.tar.gz"
            release-assets/openapi.yaml
            release-assets/uv.lock
            release-assets/pnpm-lock.yaml
            release-assets/LICENSE
            release-assets/THIRD_PARTY_NOTICES.md
            release-assets/SHA256SUMS
          )
          ASSET_ARGS=()
          for asset in "${ASSETS[@]}"; do
            ASSET_ARGS+=(--asset "$asset")
          done
          python scripts/verify_release_evidence.py \
            --release-json release-assets/release-draft.json \
            --expected-tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" \
            --expected-prerelease "$PRERELEASE" \
            --expected-state draft \
            "${ASSET_ARGS[@]}"

      - name: Publish the verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify immutable release, assets, image, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ASSETS=(
            release-assets/release-manifest.json
            "release-assets/maru-docs-$RELEASE_VERSION.tar.gz"
            release-assets/openapi.yaml
            release-assets/uv.lock
            release-assets/pnpm-lock.yaml
            release-assets/LICENSE
            release-assets/THIRD_PARTY_NOTICES.md
            release-assets/SHA256SUMS
          )
          ASSET_ARGS=()
          for asset in "${ASSETS[@]}"; do
            ASSET_ARGS+=(--asset "$asset")
          done

          RELEASE_VERIFIED=false
          for attempt in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              > release-assets/release-published.json
            if python scripts/verify_release_evidence.py \
                --release-json release-assets/release-published.json \
                --expected-tag "$RELEASE_TAG" \
                --expected-commit "$GITHUB_SHA" \
                --expected-prerelease "$PRERELEASE" \
                --expected-state immutable \
                "${ASSET_ARGS[@]}" \
              && gh release verify "$RELEASE_TAG" --format json \
                > release-assets/release-attestation.json; then
              RELEASE_VERIFIED=true
              break
            fi
            echo "Immutable release evidence is not ready (attempt $attempt/12)."
            sleep 10
          done
          if [[ "$RELEASE_VERIFIED" != "true" ]]; then
            echo "The published release did not become verifiably immutable."
            exit 1
          fi

          REMOTE_TAG=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [[ "$REMOTE_TAG" != "$GITHUB_SHA" ]]; then
            echo "Published release tag $RELEASE_TAG does not target $GITHUB_SHA."
            exit 1
          fi

          for asset in "${ASSETS[@]}"; do
            asset_name=$(basename "$asset")
            gh release verify-asset "$RELEASE_TAG" "$asset" --format json \
              > "release-assets/release-asset-attestation-$asset_name.json"
          done

          IMAGE_MANIFEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}')
          ACTUAL_IMAGE_DIGEST=$(python -c 'import json, sys; print(json.load(sys.stdin)["digest"])' <<< "$IMAGE_MANIFEST")
          if [[ "$ACTUAL_IMAGE_DIGEST" != "$IMAGE_DIGEST" ]]; then
            echo "Published image tag does not resolve to the certified digest."
            exit 1
          fi

          IMAGE_NAME=${IMAGE%:*}
          IMAGE_VERIFIED=false
          for attempt in {1..12}; do
            if gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --format json \
                > release-assets/image-attestation.json; then
              IMAGE_VERIFIED=true
              break
            fi
            echo "Image provenance is not ready (attempt $attempt/12)."
            sleep 10
          done
          if [[ "$IMAGE_VERIFIED" != "true" ]]; then
            echo "The published image has no verifiable repository attestation."
            exit 1
          fi

      - name: Upload release evidence to the workflow
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30
