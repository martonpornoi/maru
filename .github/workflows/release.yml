name: Release

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release pull request number
        required: true
        type: number
      channel:
        description: Candidate for rehearsal, gold for a supported release
        required: true
        default: candidate
        type: choice
        options: [candidate, gold]
      candidate_number:
        description: Positive sequence for a candidate; leave empty for gold
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_pr }}-${{ inputs.channel }}-${{ inputs.candidate_number || 'gold' }}
  cancel-in-progress: false

jobs:
  certify:
    name: Certify exact source
    uses: ./.github/workflows/_full-ci.yml

  publish:
    name: Publish immutable release
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.channel == 'gold' && 'gold' || 'candidate' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release PR and derive CalVer
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          CANDIDATE_NUMBER: ${{ inputs.candidate_number }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main."
            exit 1
          fi
          MERGED_AT=$(gh pr view "$RELEASE_PR" --json mergedAt --jq .mergedAt)
          MERGE_SHA=$(gh pr view "$RELEASE_PR" --json mergeCommit --jq .mergeCommit.oid)
          BASE_BRANCH=$(gh pr view "$RELEASE_PR" --json baseRefName --jq .baseRefName)
          STATE=$(gh pr view "$RELEASE_PR" --json state --jq .state)
          if [[ "$STATE" != "MERGED" || "$BASE_BRANCH" != "main" || "$MERGE_SHA" != "$GITHUB_SHA" ]]; then
            echo "The release PR must be merged into main at the exact workflow commit."
            exit 1
          fi
          CANDIDATE_ARGS=()
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            CANDIDATE_ARGS=(--candidate-number "$CANDIDATE_NUMBER")
          fi
          python scripts/release_metadata.py \
            --pull-request "$RELEASE_PR" \
            --merged-at "$MERGED_AT" \
            --commit "$GITHUB_SHA" \
            --channel "$RELEASE_CHANNEL" \
            "${CANDIDATE_ARGS[@]}" \
            --output-directory release-assets
          cat release-assets/github-output >> "$GITHUB_OUTPUT"
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          GENERATED_VERSION=$(sed -n 's/^python_version=//p' release-assets/github-output)
          if [[ "$EXPECTED_VERSION" != "$GENERATED_VERSION" ]]; then
            echo "pyproject.toml version $EXPECTED_VERSION must equal $GENERATED_VERSION."
            exit 1
          fi
          TAG=$(sed -n 's/^tag=//p' release-assets/github-output)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Git tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image name
        id: image
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Container image $IMAGE already exists."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish the application image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            MARU_BUILD_VERSION=${{ steps.metadata.outputs.version }}
            MARU_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Download certified contributor documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contributor-documentation
          path: release-assets/docs

      - name: Assemble release evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python -c "import json, pathlib; p=pathlib.Path('release-assets/release-manifest.json'); d=json.loads(p.read_text()); d.update({'image': '$IMAGE', 'image_digest': '$IMAGE_DIGEST'}); p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')"
          tar -czf "release-assets/maru-docs-$RELEASE_VERSION.tar.gz" -C release-assets/docs .
          rm -rf release-assets/docs release-assets/github-output
          cp openapi.yaml uv.lock LICENSE release-assets/
          cp frontends/staff-console/pnpm-lock.yaml release-assets/pnpm-lock.yaml
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
          printf '%s\n\nOCI image: `%s@%s`\n\nThis release was certified from pull request #%s and exact commit `%s`.\n' \
            "$RELEASE_TITLE" "$IMAGE" "$IMAGE_DIGEST" "${{ inputs.release_pr }}" "$GITHUB_SHA" \
            > release-assets/release-notes.md

      - name: Create the unique GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          RELEASE_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/release-manifest.json \
            "release-assets/maru-docs-$RELEASE_VERSION.tar.gz" \
            release-assets/openapi.yaml \
            release-assets/uv.lock \
            release-assets/pnpm-lock.yaml \
            release-assets/LICENSE \
            release-assets/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-assets/release-notes.md \
            --generate-notes \
            "${RELEASE_ARGS[@]}"

      - name: Upload release evidence to the workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30
