name: Pull request

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.plan.outputs.documentation }}
      frontend: ${{ steps.plan.outputs.frontend }}
      python: ${{ steps.plan.outputs.python }}
      packaging: ${{ steps.plan.outputs.packaging }}
      security: ${{ steps.plan.outputs.security }}
      integration: ${{ steps.plan.outputs.integration }}
      destructive: ${{ steps.plan.outputs.destructive }}
      destructive-approved: ${{ steps.plan.outputs.destructive_approved }}
      deleted-count: ${{ steps.plan.outputs.deleted_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build fail-closed CI plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS_JSON: >-
            ${{
              github.event.action == 'labeled' &&
              github.event.label.name == 'destructive-change-reviewed' &&
              github.actor == github.repository_owner &&
              toJSON(github.event.pull_request.labels.*.name) ||
              '[]'
            }}
        run: |
          if [[ -z "${BASE_SHA//0/}" ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          python scripts/ci_changes.py plan \
            --base "$BASE_SHA" --head "$GITHUB_SHA" \
            --labels-json "$PR_LABELS_JSON" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify draft locked and automation inputs
        if: ${{ github.event.pull_request.draft == true }}
        run: |
          python -m pip install uv==0.11.29 PyYAML==6.0.3
          uv lock --check
          python scripts/validate_actions_allowlist.py

  repository-safety:
    name: Repository safety
    needs: changes
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require maintainer review for destructive changes
        if: ${{ needs.changes.outputs.destructive-approved != 'true' }}
        env:
          DELETED_COUNT: ${{ needs.changes.outputs.deleted-count }}
        run: |
          echo "This change deletes $DELETED_COUNT files or a protected path."
          echo "The repository owner must apply destructive-change-reviewed."
          exit 1
      - name: Record safe repository scope
        run: echo "Repository deletion policy is satisfied."

  quality:
    name: Relevant quality
    needs: [changes, repository-safety]
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.integration != 'full'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.python == 'true' }}
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.python == 'true' }}
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontends/staff-console/pnpm-lock.yaml
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.29
          uv sync --all-groups --locked
      - name: Repository static checks
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run python scripts/validate_docs.py
      - name: Distribution license contracts
        run: |
          uv run pytest tests/unit/test_package_licensing.py \
            tests/unit/test_release_metadata.py -q
      - name: Build and inspect Python distributions
        if: ${{ needs.changes.outputs.packaging == 'true' }}
        run: |
          uv build --out-dir .ci-distributions
          uv run python scripts/verify_package_artifacts.py \
            --distribution-directory .ci-distributions
      - name: Build contributor documentation
        if: ${{ needs.changes.outputs.documentation == 'true' }}
        run: |
          uv run pydoclint src scripts
          uv run python scripts/validate_python_docstrings.py src scripts
          uv run sphinx-build -W --keep-going --fresh-env -d docs/_build/doctrees -b html docs docs/_build/html
      - name: Upload contributor documentation
        if: ${{ needs.changes.outputs.documentation == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contributor-documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7
      - name: Install locked Staff Console dependencies
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.security == 'true' || needs.changes.outputs.python == 'true' }}
        working-directory: frontends/staff-console
        run: pnpm install --frozen-lockfile
      - name: Django and generated contracts
        if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true' }}
        run: |
          uv run python src/manage.py check --settings=maru.settings.local
          uv run python src/manage.py makemigrations --check --dry-run --settings=maru.settings.local
          uv run python scripts/verify_production_settings.py
          uv run python src/manage.py spectacular --file openapi.yaml --validate --settings=maru.settings.local
          pnpm --dir frontends/staff-console run generate:api
          git diff --exit-code -- openapi.yaml
          git diff --exit-code -- frontends/staff-console/src/api/schema.d.ts
      - name: Staff Console acceptance
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        working-directory: frontends/staff-console
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
          git diff --exit-code -- ../../src/maru/core/static/staff-console
          if ! UNTRACKED_GENERATED_FILES=$(git ls-files --others --exclude-standard -- ../../src/maru/core/static/staff-console); then
            echo "Unable to inspect generated Staff Console output."
            exit 1
          fi
          if test -n "$UNTRACKED_GENERATED_FILES"; then
            printf '%s\n' "$UNTRACKED_GENERATED_FILES"
            exit 1
          fi
      - name: Dependency vulnerability audit
        if: ${{ needs.changes.outputs.security == 'true' }}
        run: |
          uv run pip-audit
          pnpm --dir frontends/staff-console audit --audit-level high

  unit:
    name: Python unit tests
    needs: [changes, repository-safety]
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.python == 'true' &&
        needs.changes.outputs.integration != 'full'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARU_DATABASE_URL: postgresql://maru:maru@127.0.0.1:1/maru_unit_no_database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: python -m pip install uv==0.11.29
      - run: uv sync --all-groups --locked
      - run: uv run pytest tests/unit -q

  targeted-integration:
    name: Targeted PostgreSQL tests
    needs: [changes, repository-safety]
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.integration == 'targeted'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: maru
          POSTGRES_USER: maru
          POSTGRES_PASSWORD: maru
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maru -d maru"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MARU_DATABASE_URL: postgresql://maru:maru@127.0.0.1:5432/maru
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: python -m pip install uv==0.11.29
      - run: uv sync --all-groups --locked
      - name: Run affected whole-file tests
        run: |
          mapfile -t TEST_FILES < <(python scripts/ci_changes.py tests --base "$BASE_SHA" --head "$GITHUB_SHA")
          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "Targeted mode selected no tests; failing closed."
            exit 1
          fi
          uv run pytest "${TEST_FILES[@]}" -q --durations=25

  full:
    name: High-risk full acceptance
    needs: [changes, repository-safety]
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.integration == 'full'
      }}
    uses: ./.github/workflows/_full-ci.yml

  pr-gate:
    name: PR gate
    needs: [changes, repository-safety, quality, unit, targeted-integration, full]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep drafts outside merge acceptance
        if: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "Draft inputs passed their lightweight preflight."
          echo "Mark the pull request ready to run authoritative acceptance."
          exit 1
      - name: Require the selected acceptance path
        if: >-
          ${{
            github.event.pull_request.draft == false &&
            (
              needs.changes.result != 'success' ||
              needs.repository-safety.result != 'success' ||
              (needs.changes.outputs.integration == 'full' && needs.full.result != 'success') ||
              (needs.changes.outputs.integration != 'full' && needs.quality.result != 'success') ||
              (needs.changes.outputs.python == 'true' && needs.changes.outputs.integration != 'full' && needs.unit.result != 'success') ||
              (needs.changes.outputs.integration == 'targeted' && needs.targeted-integration.result != 'success')
            )
          }}
        run: exit 1
      - name: Record pull request acceptance
        if: ${{ github.event.pull_request.draft == false }}
        run: echo "The change-aware Maru acceptance policy passed."
