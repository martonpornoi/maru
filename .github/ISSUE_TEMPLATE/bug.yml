name: Bug report
description: Report a Maru defect without disclosing sensitive data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities or include personal data. Use Maru's
        private vulnerability form at
        https://github.com/martonpornoi/maru/security/advisories/new. Use
        synthetic data and sanitized evidence only.
  - type: checkboxes
    id: preparation
    attributes:
      label: Preparation
      options:
        - label: I searched existing Issues and Discussions for this behavior.
          required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include the visible failure state or safe error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and sanitized evidence
      description: >-
        Give the smallest safe synthetic-data reproduction, including role,
        organization/edition scope, sequence, frequency, and sanitized logs.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Choose the closest observable effect; maintainers will confirm severity.
      options:
        - A complete workflow is blocked
        - A workflow is degraded but has a safe workaround
        - A visible result is incorrect or confusing
        - Contributor tooling or documentation is affected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: 40-character commit or vYYYY.MM.PR
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PostgreSQL, browser, and deployment shape where relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, tokens, database dumps, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
