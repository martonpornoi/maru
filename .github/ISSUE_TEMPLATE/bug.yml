name: Bug report
description: Report a Maru defect without disclosing sensitive data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities or include personal data. Use Maru's
        private vulnerability form at
        https://github.com/martonpornoi/maru/security/advisories/new.
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction conditions
      description: >-
        Give the smallest safe synthetic-data reproduction when available.
        Otherwise describe frequency, triggering conditions, and sanitized logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: 40-character commit or vYYYY.MM.PR
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PostgreSQL, browser, and deployment shape where relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, tokens, database dumps, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
