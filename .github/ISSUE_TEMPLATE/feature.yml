name: Feature proposal
description: Propose a scoped product or contributor improvement.
title: "[Proposal]: "
labels: ["proposal", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report vulnerabilities or include personal data. Use Maru's
        private vulnerability form at
        https://github.com/martonpornoi/maru/security/advisories/new. Use a
        Discussion for an early idea that does not yet have a bounded outcome.
        Requirements and accepted ADRs remain authoritative when they differ
        from issue conversation.
  - type: checkboxes
    id: preparation
    attributes:
      label: Preparation
      options:
        - label: I searched existing Issues and Discussions for overlapping work.
          required: true
        - label: I reviewed the current project state and roadmap.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or job
      description: Who needs what outcome, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: Current workflow or workaround
      description: How is this job handled today, inside or outside Maru?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance boundary
      description: Describe observable success for the affected roles and states.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
      description: What related behavior should remain outside this issue?
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Requirements, decisions, and dependencies
      description: Link relevant requirement IDs, ADRs, issues, or prerequisite work when known.
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and operations
      description: >-
        Note tenant and edition scope, permissions, personal data, retention,
        recovery, degraded operation, and deployment implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or workarounds where relevant.
  - type: checkboxes
    id: safety_confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, tokens, database dumps, and personal data.
          required: true
        - label: This proposal does not disclose a security vulnerability.
          required: true
