# Reference edge adapter for the immutable OCI static-delivery rehearsal.
# Snapshot this file as /etc/nginx/conf.d/default.conf in the run-owned config
# volume while retaining the image's reviewed top-level /etc/nginx/nginx.conf.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # The manifest extension is absent from the stock MIME table. Keep this
    # exact location separate so the normal inherited MIME mappings remain
    # available to every other collected asset.
    location = /static/core/brand/site.webmanifest {
        root /srv/maru;
        default_type application/manifest+json;
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET {
            deny all;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ReDoc 2.5.3 embeds one client-side attribution-logo URL that otherwise
    # calls cdn.redoc.ly after the local bundle runs. Transform only that exact
    # reviewed representation at the edge: the candidate image and populated
    # static volume remain byte-for-byte unchanged, attribution text remains,
    # and the decorative image becomes an inline transparent pixel. Do not
    # reuse the source file's validators or permit ranges to bypass filtering
    # for this distinct representation.
    location = /static/drf_spectacular_sidecar/redoc/bundles/redoc.standalone.js {
        root /srv/maru;
        try_files $uri =404;
        disable_symlinks on;
        autoindex off;
        limit_except GET {
            deny all;
        }
        set $redoc_precondition "$request_method:$http_if_none_match";
        if ($redoc_precondition ~ "^(GET|HEAD):[*]$") {
            return 304;
        }
        etag off;
        if_modified_since off;
        max_ranges 0;
        gzip off;
        sub_filter_types application/javascript;
        sub_filter_once on;
        sub_filter_last_modified off;
        sub_filter 'https://cdn.redoc.ly/redoc/logo-mini.svg' 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /static {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        return 404;
    }

    # Collected files are copied unchanged from the exact application image
    # into /srv/maru/static and mounted read-only into this container.
    location ^~ /static/ {
        root /srv/maru;
        try_files $uri =404;
        disable_symlinks on;
        autoindex off;
        limit_except GET {
            deny all;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Runtime media is not part of the immutable candidate and must never fall
    # through to the application or be cached by an intermediary.
    location = /media {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ^~ /media/ {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Everything outside /static remains an application route. This edge is
    # the first trusted hop, so it replaces rather than extends forwarded
    # client metadata and never caches upstream responses.
    location / {
        # Nginx normalizes dot segments before choosing a location. Refuse a
        # raw immutable or runtime-media prefix here when normalization would
        # otherwise make it reach the dynamic proxy. A return-only rewrite
        # guard is safe in this location and preserves ordinary application
        # routes plus canonical /static/ and /media/ locations above.
        if ($request_uri ~* "^(?:/|%2f|%5c|\\x5c)+static(?:/|%2f|%5c|\\x5c)") {
            return 404;
        }
        if ($request_uri ~* "^(?:/|%2f|%5c|\\x5c)+media(?:/|%2f|%5c|\\x5c)") {
            return 404;
        }
        if ($request_uri ~* "^[^?]*(?:/|%2f|%5c|\\x5c)(?:[.]|%2e){1,2}(?:/|%2f|%5c|\\x5c|[?]|$)") {
            return 404;
        }

        proxy_pass http://maru-web:8000;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_next_upstream off;

        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Server "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}
