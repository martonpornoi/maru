  /api/v1/organizations/{organization_id}/audit-events:
    get:
      operationId: audit_list_security_events
      parameters:
      - in: query
        name: correlation_id
        schema:
          type: string
          format: uuid
      - in: query
        name: edition_id
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: outcome
        schema:
          enum:
          - allow
          - deny
          - error
          type: string
          minLength: 1
        description: |-
          * `allow` - Allow
          * `deny` - Deny
          * `error` - Error
      - in: query
        name: principal_id
        schema:
          type: string
          format: uuid
      - in: query
        name: purpose
        schema:
          enum:
          - security_investigation
          - privacy_request
          - compliance_review
          - subject_support
          - integrity_review
          type: string
          minLength: 1
        description: |-
          * `security_investigation` - Security investigation
          * `privacy_request` - Privacy request
          * `compliance_review` - Compliance review
          * `subject_support` - Subject support
          * `integrity_review` - Integrity review
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
