components:
  schemas:
    AccessAssignment:
      type: object
      description: Serialize and validate access assignment data.
      properties:
        id:
          type: string
          format: uuid
        person_display_name:
          type: string
        person_email:
          type: string
          format: email
        group_code:
          type: string
        group_name:
          type: string
        scope_label:
          type: string
        status:
          type: string
        effective_from:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        granted_by_name:
          type: string
        approved_by_name:
          type: string
      required:
      - approved_by_name
      - effective_from
      - expires_at
      - granted_by_name
      - group_code
      - group_name
      - id
      - person_display_name
      - person_email
      - scope_label
      - status
    AccessAssignmentCreate:
      type: object
      description: Serialize and validate access assignment create data.
      properties:
        person_email:
          type: string
          format: email
          maxLength: 254
        group_code:
          type: string
          maxLength: 80
        approver_email:
          type: string
          format: email
          maxLength: 254
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        reason:
          type: string
          maxLength: 240
      required:
      - approver_email
      - group_code
      - person_email
      - reason
    AccessCapability:
      type: object
      description: Serialize and validate access capability data.
      properties:
        code:
          type: string
        label:
          type: string
        description:
          type: string
      required:
      - code
      - description
      - label
    AccessGroup:
      type: object
      description: Serialize and validate access group data.
      properties:
        role_version_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          type: integer
        description:
          type: string
        capability_count:
          type: integer
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AccessCapability'
      required:
      - capabilities
      - capability_count
      - code
      - description
      - name
      - role_version_id
      - version
    AccessPreview:
      type: object
      description: Serialize and validate access preview data.
      properties:
        mode:
          $ref: '#/components/schemas/ModeEnum'
        subject_id:
          type: string
          format: uuid
        subject_label:
          type: string
        scope_level:
          type: string
        scope_label:
          type: string
        evaluated_at:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AccessPreviewCapability'
        disclosure_limited_count:
          type: integer
        session_unchanged:
          type: boolean
        mutation_allowed:
          type: boolean
      required:
      - capabilities
      - disclosure_limited_count
      - evaluated_at
      - mode
      - mutation_allowed
      - scope_label
      - scope_level
      - session_unchanged
      - subject_id
      - subject_label
    AccessPreviewCapability:
      type: object
      description: Serialize and validate access preview capability data.
      properties:
        capability_code:
          type: string
        label:
          type: string
        description:
          type: string
        source_category:
          type: string
        source_label:
          type: string
        obligations:
          type: array
          items:
            type: string
        visible_fields:
          type: array
          items:
            type: string
        data_preview_available:
          type: boolean
        disclosure_limited:
          type: boolean
      required:
      - capability_code
      - data_preview_available
      - description
      - disclosure_limited
      - label
      - obligations
      - source_category
      - source_label
      - visible_fields
    AccessPreviewRequest:
      type: object
      description: Serialize and validate access preview request data.
      properties:
        mode:
          $ref: '#/components/schemas/ModeEnum'
        person_email:
          type: string
          format: email
          maxLength: 254
        role_version_id:
          type: string
          format: uuid
      required:
      - mode
    AccessPurposeEnum:
      enum:
      - incident_response
      - inventory_verification
      - pickup_coordination
      - provider_contact
      - return_coordination
      type: string
      description: |-
        * `incident_response` - incident_response
        * `inventory_verification` - inventory_verification
        * `pickup_coordination` - pickup_coordination
        * `provider_contact` - provider_contact
        * `return_coordination` - return_coordination
    AccessWorkspace:
      type: object
      description: Serialize and validate access workspace data.
      properties:
        organization_name:
          type: string
        edition_name:
          type: string
        can_revoke_assignments:
          type: boolean
        effective_access:
          $ref: '#/components/schemas/EffectiveAccessSummary'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AccessGroup'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AccessAssignment'
      required:
      - assignments
      - can_revoke_assignments
      - edition_name
      - effective_access
      - groups
      - organization_name
    AccountBootstrap:
      type: object
      description: Serialize and validate account bootstrap data.
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - display_name
      - email
      - password
    AccountRestriction:
      type: object
      description: Serialize and validate account restriction data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        edition_id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          allOf:
          - $ref: '#/components/schemas/AccountRestrictionKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ActiveRevokedStatusEnum'
          readOnly: true
        attendee_message:
          type: string
          readOnly: true
        effective_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        appeal_status:
          type:
          - string
          - 'null'
          description: |-
            Return appeal status.

            Parameters
            ----------
            obj : AccountRestriction
                The model instance being validated or presented.

            Returns
            -------
            str | None
                The resolved str | None for the requested scope.
          readOnly: true
      required:
      - appeal_status
      - attendee_message
      - edition_id
      - effective_at
      - expires_at
      - id
      - kind
      - organization_id
      - revoked_at
      - status
    AccountRestrictionKindEnum:
      enum:
      - registration
      - attendance
      - public_profile
      - credential
      - communication
      type: string
      description: |-
        * `registration` - Registration
        * `attendance` - Attendance
        * `public_profile` - Public attendee profile
        * `credential` - Credential
        * `communication` - Communication
    AccountSecurityEvent:
      type: object
      description: Serialize and validate account security event data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/AccountSecurityEventEventTypeEnum'
          readOnly: true
        event_label:
          type: string
        outcome:
          allOf:
          - $ref: '#/components/schemas/AccountSecurityEventOutcomeEnum'
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        source_channel:
          type: string
          readOnly: true
        detail_code:
          type: string
          readOnly: true
      required:
      - detail_code
      - event_label
      - event_type
      - id
      - occurred_at
      - outcome
      - source_channel
    AccountSecurityEventEventTypeEnum:
      enum:
      - sign_in
      - sign_out
      - credential_changed
      - contact_verified
      - recovery_requested
      - recovery_completed
      - session_revoked
      - step_up_completed
      - data_export
      - account_invitation_created
      - account_invitation_reissued
      - account_invitation_revoked
      - account_invitation_expired
      - account_invitation_accepted
      type: string
      description: |-
        * `sign_in` - Signed in
        * `sign_out` - Signed out
        * `credential_changed` - Credential changed
        * `contact_verified` - Contact verified
        * `recovery_requested` - Recovery requested
        * `recovery_completed` - Recovery completed
        * `session_revoked` - Session revoked
        * `step_up_completed` - Extra sign-in check completed
        * `data_export` - Account export
        * `account_invitation_created` - Account invitation created
        * `account_invitation_reissued` - Account invitation reissued
        * `account_invitation_revoked` - Account invitation revoked
        * `account_invitation_expired` - Account invitation expired
        * `account_invitation_accepted` - Account invitation accepted
    AccountSecurityEventOutcomeEnum:
      enum:
      - succeeded
      - failed
      type: string
      description: |-
        * `succeeded` - Succeeded
        * `failed` - Failed
    AccountSession:
      type: object
      description: Serialize and validate account session data.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        created_channel:
          type: string
          readOnly: true
        created_at:
