          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineOperation'
          description: ''
  /api/v1/public/organizations/{organization_id}/payments/{provider_code}/webhook:
    post:
      operationId: registration_receive_payment_webhook
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: provider_code
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/public/sessions:
    post:
      operationId: identity_create_public_session
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSignIn'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/live:
    get:
      operationId: platform_liveness
      tags:
      - health
      responses:
        '200':
          description: The process can serve requests.
  /health/ready:
    get:
      operationId: platform_readiness
      tags:
      - health
      responses:
        '200':
          description: Required dependencies are ready.
        '503':
          description: A required dependency is unavailable.
