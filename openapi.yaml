openapi: 3.1.0
info:
  title: Maru API
  version: 0.1.0
  description: Versioned API for the Maru convention operating platform.
paths:
  /api/v1/catalog/organizations/{organization_id}/editions/{edition_id}/:
    get:
      operationId: catalog_retrieve_edition_catalog
      description: |-
        Retrieve the edition catalog.

        Keep authenticated catalog data and safe errors out of shared caches.

        Parameters
        ----------
        request : Request
            The incoming HTTP request and authenticated principal context.
        organization_id : UUID
            The organization identifier that owns the requested resource.
        edition_id : UUID
            The event edition identifier that scopes the operation.

        Returns
        -------
        Response
            The HTTP response for the requested operation.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDetail'
          description: ''
    post:
      operationId: catalog_create_edition_catalog
      description: |-
        Create the edition catalog.

        Keep authenticated catalog data and safe errors out of shared caches.

        Parameters
        ----------
        request : Request
            The incoming HTTP request and authenticated principal context.
        organization_id : UUID
            The organization identifier that owns the requested resource.
        edition_id : UUID
            The event edition identifier that scopes the operation.

        Returns
        -------
        Response
            The HTTP response for the requested operation.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        description: Canonical lower-case hyphenated UUID. Exact retries return HTTP
